name: Diagnose Server

on:
  workflow_dispatch:
  push:
    branches: [claude/main]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Run diagnostics via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            echo "===== GUNICORN SERVICE STATUS ====="
            sudo systemctl status specimenbase --no-pager || true

            echo ""
            echo "===== GUNICORN LOGS (last 80 lines) ====="
            sudo journalctl -u specimenbase -n 80 --no-pager || true

            echo ""
            echo "===== NGINX STATUS ====="
            sudo systemctl status nginx --no-pager || true

            echo ""
            echo "===== NGINX CONFIG TEST ====="
            sudo nginx -t 2>&1 || true

            echo ""
            echo "===== NGINX ERROR LOG (last 30 lines) ====="
            sudo tail -30 /var/log/nginx/error.log || true

            echo ""
            echo "===== SOCKET ====="
            ls -la /run/gunicorn/ 2>/dev/null || echo "no /run/gunicorn directory"

            echo ""
            echo "===== APP DIR ====="
            ls -la /srv/specimenbase/ 2>/dev/null || echo "/srv/specimenbase missing"

            echo ""
            echo "===== DISK SPACE ====="
            df -h /srv /tmp /

            echo ""
            echo "===== MEMORY ====="
            free -h

            echo ""
            echo "===== .ENV FILE (keys only, no values) ====="
            grep -oP '^[A-Z_]+' /srv/specimenbase/.env 2>/dev/null || echo ".env missing"

            echo ""
            echo "===== ALLOWED_HOSTS ====="
            grep ALLOWED_HOSTS /srv/specimenbase/.env 2>/dev/null || echo "not set"

            echo ""
            echo "===== SUPERUSER EXISTS ====="
            cd /srv/specimenbase && venv/bin/python manage.py shell -c "from django.contrib.auth.models import User; admins=User.objects.filter(is_superuser=True); print(f'{admins.count()} superuser(s): {[u.username for u in admins]}')" 2>/dev/null || echo "shell failed"

            echo ""
            echo "===== RECENT AUTH FAILURES (gunicorn log) ====="
            sudo journalctl -u specimenbase -n 200 --no-pager 2>/dev/null | grep -i "login\|auth\|403\|400\|csrf\|session" | tail -20 || true

            echo ""
            echo "===== AWS CLI VERSION ====="
            aws --version 2>&1 || echo "AWS CLI not installed"

            echo ""
            echo "===== EC2 INSTANCE IDENTITY (confirms IAM role attached) ====="
            curl -sf --max-time 3 http://169.254.169.254/latest/meta-data/iam/security-credentials/ || echo "No IAM role found on instance"

            echo ""
            echo "===== S3 BUCKET ACCESS TEST ====="
            aws s3 ls s3://specimenbase-backups/ 2>&1 || echo "FAILED: cannot list bucket"

            echo ""
            echo "===== DB.SQLITE3 SIZE (what would be backed up) ====="
            ls -lh /srv/specimenbase/db.sqlite3 2>/dev/null || echo "db.sqlite3 not found"

            echo ""
            echo "===== MEDIA DIR SIZE ====="
            du -sh /srv/specimenbase/media/ 2>/dev/null || echo "media/ not found"
