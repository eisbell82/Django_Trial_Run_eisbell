name: Bi-weekly Backup

on:
  schedule:
    - cron: '0 3 1,15 * *'  # 3am UTC on the 1st and 15th of every month
  workflow_dispatch:          # allow manual trigger from Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Backup database and media to S3
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            set -euo pipefail
            DATE=$(date +%Y-%m-%d)
            BUCKET="specimenbase-backups-318270726326-us-east-1-an"

            # Use instance IAM role, not any stored user credentials
            rm -f ~/.aws/credentials

            echo "==> Backing up database (db-$DATE.sqlite3)..."
            aws s3 cp /srv/specimenbase/db.sqlite3 \
              "s3://$BUCKET/snapshots/db-$DATE.sqlite3"

            echo "==> Backing up media (snapshots/media-$DATE/)..."
            aws s3 sync /srv/specimenbase/media/ \
              "s3://$BUCKET/snapshots/media-$DATE/"

            echo "==> Setting 60-day expiry on snapshots/..."
            aws s3api put-bucket-lifecycle-configuration \
              --bucket "$BUCKET" \
              --lifecycle-configuration '{
                "Rules": [{
                  "ID": "expire-snapshots-60-days",
                  "Filter": {"Prefix": "snapshots/"},
                  "Status": "Enabled",
                  "Expiration": {"Days": 60}
                }]
              }'

            echo "==> Done. Backup stored at s3://$BUCKET/snapshots/db-$DATE.sqlite3"
