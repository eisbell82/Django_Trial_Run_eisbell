name: Scheduled Backup

on:
  schedule:
    - cron: '0 3 * * *'   # 3am UTC every day
  workflow_dispatch:        # allow manual trigger from Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Backup database and media to S3
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            set -euo pipefail
            DATE=$(date +%Y-%m-%d)
            DAY=$(date +%-d)
            BUCKET="specimenbase-backups-318270726326-us-east-1-an"

            # Use instance IAM role, not any stored user credentials
            rm -f ~/.aws/credentials

            # ── Daily backup (kept 7 days) ────────────────────────────────
            echo "==> Daily backup: daily/db-$DATE.sqlite3 ..."
            aws s3 cp /srv/specimenbase/db.sqlite3 \
              "s3://$BUCKET/daily/db-$DATE.sqlite3"

            # ── Bi-weekly snapshot (kept 60 days) — runs on 1st and 15th ─
            if [ "$DAY" = "1" ] || [ "$DAY" = "15" ]; then
              echo "==> Bi-weekly snapshot: snapshots/db-$DATE.sqlite3 ..."
              aws s3 cp /srv/specimenbase/db.sqlite3 \
                "s3://$BUCKET/snapshots/db-$DATE.sqlite3"
              echo "==> Bi-weekly media snapshot: snapshots/media-$DATE/ ..."
              aws s3 sync /srv/specimenbase/media/ \
                "s3://$BUCKET/snapshots/media-$DATE/"
            fi

            # ── Lifecycle rules (idempotent, safe to set every run) ───────
            aws s3api put-bucket-lifecycle-configuration \
              --bucket "$BUCKET" \
              --lifecycle-configuration '{
                "Rules": [
                  {
                    "ID": "expire-daily-7-days",
                    "Filter": {"Prefix": "daily/"},
                    "Status": "Enabled",
                    "Expiration": {"Days": 7}
                  },
                  {
                    "ID": "expire-snapshots-60-days",
                    "Filter": {"Prefix": "snapshots/"},
                    "Status": "Enabled",
                    "Expiration": {"Days": 60}
                  }
                ]
              }'

            echo "==> Done."
