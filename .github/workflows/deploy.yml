name: Deploy to AWS

on:
  push:
    branches: [claude/main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script_stop: false
          script: |
            LOG=/srv/specimenbase/staticfiles/deploy_log.txt
            mkdir -p /srv/specimenbase/staticfiles
            echo "=== git version ===" > $LOG
            git --version >> $LOG 2>&1
            echo "=== /srv/specimenbase dir ===" >> $LOG
            ls -la /srv/specimenbase >> $LOG 2>&1
            echo "=== git remote ===" >> $LOG
            git -C /srv/specimenbase remote -v >> $LOG 2>&1; echo "exit:$?" >> $LOG
            echo "=== git fetch ===" >> $LOG
            git -C /srv/specimenbase fetch origin claude/main >> $LOG 2>&1; echo "fetch_exit:$?" >> $LOG
            echo "=== git reset ===" >> $LOG
            git -C /srv/specimenbase reset --hard origin/claude/main >> $LOG 2>&1; echo "reset_exit:$?" >> $LOG
            echo "=== deploy.sh ===" >> $LOG
            DEPLOY_BRANCH=claude/main bash /srv/specimenbase/deploy/deploy.sh >> $LOG 2>&1; echo "deploy_exit:$?" >> $LOG
