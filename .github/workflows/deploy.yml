name: Deploy to AWS

on:
  push:
    branches: [claude/aws-deployment-setup-urqY9]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            git -C /srv/specimenbase fetch origin claude/aws-deployment-setup-urqY9
            git -C /srv/specimenbase reset --hard origin/claude/aws-deployment-setup-urqY9
            DEPLOY_BRANCH=claude/aws-deployment-setup-urqY9 bash /srv/specimenbase/deploy/deploy.sh
