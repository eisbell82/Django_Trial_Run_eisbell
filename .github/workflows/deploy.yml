name: Deploy to AWS

on:
  push:
    branches: [main, claude/aws-deployment-setup-uzrvx]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            git -C /srv/specimenbase fetch origin main
            git -C /srv/specimenbase reset --hard origin/main
            DEPLOY_BRANCH=main bash /srv/specimenbase/deploy/deploy.sh
