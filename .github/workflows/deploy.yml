name: Deploy to AWS

on:
  push:
    branches: [claude/django-app-deployment-qvuJi]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            git -C /srv/specimenbase fetch origin claude/django-app-deployment-qvuJi
            git -C /srv/specimenbase reset --hard origin/claude/django-app-deployment-qvuJi
            DEPLOY_BRANCH=claude/django-app-deployment-qvuJi bash /srv/specimenbase/deploy/deploy.sh
