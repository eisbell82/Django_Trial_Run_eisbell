name: Deploy to AWS

on:
  push:
    branches: [claude/django-app-deployment-qvuJi]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: bash /srv/specimenbase/deploy/deploy.sh
