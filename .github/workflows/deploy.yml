name: Deploy to AWS

on:
  push:
    branches: [claude/main]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect server state
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            mkdir -p /srv/specimenbase/staticfiles
            {
              echo "=== whoami ==="
              whoami
              echo "=== /srv contents ==="
              ls /srv/ 2>&1
              echo "=== /srv/specimenbase ==="
              ls -la /srv/specimenbase/ 2>&1
              echo "=== git check ==="
              git -C /srv/specimenbase status 2>&1
              echo "=== git remote ==="
              git -C /srv/specimenbase remote -v 2>&1
              echo "=== .env exists ==="
              ls /srv/specimenbase/.env 2>&1
              echo "=== venv exists ==="
              ls /srv/specimenbase/venv/bin/python 2>&1
              echo "=== sudo test ==="
              sudo whoami 2>&1
            } > /srv/specimenbase/staticfiles/inspect.txt 2>&1 || true

  deploy:
    runs-on: ubuntu-latest
    needs: inspect
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            git -C /srv/specimenbase fetch origin claude/main
            git -C /srv/specimenbase reset --hard origin/claude/main
            DEPLOY_BRANCH=claude/main bash /srv/specimenbase/deploy/deploy.sh
