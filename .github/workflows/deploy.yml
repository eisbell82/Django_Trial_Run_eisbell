name: Deploy to AWS

on:
  push:
    branches: [claude/main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            echo "SSH OK: $(whoami) @ $(hostname)"
            echo "Dir check: $(ls /srv/ 2>&1)"
