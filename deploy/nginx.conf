# nginx site configuration for SpecimenBase
# Place at: /etc/nginx/sites-available/specimenbase
# Then: sudo ln -s /etc/nginx/sites-available/specimenbase /etc/nginx/sites-enabled/

upstream specimenbase_app {
    server unix:/run/gunicorn/specimenbase.sock fail_timeout=0;
}

server {
    listen 80 default_server;
    server_name _;

    # Redirect HTTP to HTTPS once SSL is set up
    # return 301 https://$host$request_uri;

    client_max_body_size 500m;   # allow large dataset uploads (admins up to 500 MB)
    client_body_timeout 600s;    # wait up to 10 min between successive reads from client

    # Static files (collectstatic output)
    location /static/ {
        alias /srv/specimenbase/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media files (uploaded datasets)
    location /media/ {
        alias /srv/specimenbase/media/;
        expires 7d;
    }

    # Proxy everything else to gunicorn
    location / {
        proxy_pass http://specimenbase_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        # All three proxy timeouts must be explicit inside the location block.
        # A server-level proxy_send_timeout can silently revert to nginx's
        # 60 s default for this location when other proxy_* directives are
        # set here — causing 502 on large uploads once forwarding to gunicorn
        # takes longer than 60 s.
        proxy_connect_timeout 75s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }
}

